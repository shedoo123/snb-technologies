<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">SNB Technologies — Engineering Beyond Limits</title>
  <desc id="desc">Custom SNB monogram with an orbital swoosh and circuit terminals, above the Technologies wordmark.</desc>
  
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#19D9F2"/>
      <stop offset=".52" stop-color="#087BFF"/>
      <stop offset="1" stop-color="#1647D8"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".52" stop-color="#C7D0DC"/>
      <stop offset="1" stop-color="#7F8DA2"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00D9F5"/>
      <stop offset="1" stop-color="#168BFF"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="#080D16"/>
  <g transform="translate(0 0)">
    
  <!-- S: open, forward-moving geometry -->
  <path d="M520 250 H260 Q215 250 215 295 V338 Q215 382 260 382 H405 Q450 382 450 427 V448 Q450 493 405 493 H205"
        fill="none" stroke="#FFFFFF" stroke-width="82" stroke-linecap="square" stroke-linejoin="round"/>
  <!-- N: rising diagonal, electric blue -->
  <path d="M555 492 V250 L760 492 V250"
        fill="none" stroke="#FFFFFF" stroke-width="82" stroke-linecap="square" stroke-linejoin="miter"/>
  <!-- B: two clean geometric bowls -->
  <path d="M875 250 V492 H1065 Q1120 492 1120 438 Q1120 385 1065 385 H875 M875 385 H1045 Q1100 385 1100 318 Q1100 250 1045 250 Z"
        fill="none" stroke="#FFFFFF" stroke-width="76" stroke-linecap="square" stroke-linejoin="round"/>
  <!-- orbital swoosh -->
  <path d="M365 555 C510 610 820 530 1020 315 C1125 202 1190 135 1280 125"
        fill="none" stroke="#FFFFFF" stroke-width="25" stroke-linecap="round"/>
  <path d="M450 570 C670 530 930 360 1080 185"
        fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" opacity=".92"/>
  <!-- subtle circuit terminals -->
  <g fill="none" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1170 250 H1300 L1370 180 H1450"/>
    <path d="M1190 315 H1325 L1395 245 H1490"/>
    <path d="M1215 380 H1335 L1400 315 H1510"/>
  </g>
  <g fill="#080D16" stroke="#FFFFFF" stroke-width="12">
    <circle cx="1450" cy="180" r="17"/>
    <circle cx="1490" cy="245" r="17"/>
    <circle cx="1510" cy="315" r="17"/>
  </g>

  </g>
  <g font-family="Montserrat, Inter, Arial, sans-serif" text-anchor="middle">
    <text x="800" y="690" font-size="112" font-weight="750" letter-spacing="15" fill="#FFFFFF">TECHNOLOGIES</text>
    <path d="M250 748 H535 M1065 748 H1350" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
    <text x="800" y="765" font-size="34" font-weight="600" letter-spacing="12" fill="#FFFFFF">ENGINEERING BEYOND LIMITS</text>
  </g>
</svg>